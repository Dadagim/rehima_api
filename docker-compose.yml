services:
  backend:
    build:
      context: .
      dockerfile: dockerfile
    env_file:
      - .env
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - backend_media:/app/media
    restart: unless-stopped

volumes:
  backend_media:
